<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You 💌</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Dancing+Script:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1, #f06292);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating hearts background */
    .hearts-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      font-size: 24px;
      animation: floatUp linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg) scale(0.5); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
    }

    /* Sparkles */
    .sparkle-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .sparkle {
      position: absolute;
      width: 6px; height: 6px;
      background: white;
      border-radius: 50%;
      animation: sparkleAnim 2s ease-in-out infinite;
    }

    @keyframes sparkleAnim {
      0%, 100% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1); opacity: 1; box-shadow: 0 0 10px #fff, 0 0 20px #ffb6c1; }
    }

    /* Password Screen */
    #password-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
    }

    .password-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      animation: fadeInUp 1s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 420px;
      width: 90%;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lock-icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: wobble 2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-5deg) scale(1); }
      25% { transform: rotate(5deg) scale(1.1); }
      50% { transform: rotate(-3deg) scale(1); }
      75% { transform: rotate(3deg) scale(1.05); }
    }

    .password-box h2 {
      color: #fff;
      font-family: 'Dancing Script', cursive;
      font-size: 32px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
    }

    .hint {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-bottom: 25px;
      font-style: italic;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .password-input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    #password-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 18px;
      font-family: 'Quicksand', sans-serif;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      transition: all 0.3s ease;
    }

    #password-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 2px;
    }

    #password-input:focus {
      border-color: #f48fb1;
      box-shadow: 0 0 20px rgba(244, 143, 177, 0.3);
      background: rgba(255, 255, 255, 0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #f48fb1, #f06292, #ec407a);
      color: white;
      font-size: 18px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(244, 143, 177, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      color: #ff6b6b;
      margin-top: 15px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .error-msg.show {
      opacity: 1;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
    }

    /* Stars on password screen */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Main Content */
    #main-content {
      display: none;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    .main-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 32px;
      padding: 60px 50px;
      max-width: 600px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }

    .main-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.1), transparent, rgba(255,255,255,0.05), transparent);
      animation: rotateBg 10s linear infinite;
    }

    @keyframes rotateBg {
      100% { transform: rotate(360deg); }
    }

    .greeting {
      font-family: 'Dancing Script', cursive;
      font-size: 52px;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 0 30px rgba(255,255,255,0.3);
      position: relative;
      z-index: 1;
      animation: textGlow 3s ease-in-out infinite;
    }

    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(255,255,255,0.3), 0 0 40px rgba(244,143,177,0.2); }
      50% { text-shadow: 0 0 30px rgba(255,255,255,0.5), 0 0 60px rgba(244,143,177,0.4), 0 0 80px rgba(244,143,177,0.2); }
    }

    .message {
      font-size: 28px;
      color: #fff;
      line-height: 1.6;
      position: relative;
      z-index: 1;
      margin-top: 20px;
      font-weight: 600;
    }

    .message .name {
      font-family: 'Dancing Script', cursive;
      font-size: 38px;
      color: #ffeb3b;
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(255, 235, 59, 0.5);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .deez-line {
      font-size: 22px;
      color: rgba(255,255,255,0.9);
      margin-top: 15px;
      position: relative;
      z-index: 1;
      font-weight: 600;
    }

    .ml-text {
      font-family: 'Dancing Script', cursive;
      font-size: 42px;
      color: #ff80ab;
      margin-top: 25px;
      position: relative;
      z-index: 1;
      animation: heartbeat 1.5s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(255, 128, 171, 0.5);
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }

    .lilies-container {
      margin-top: 30px;
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lily {
      font-size: 40px;
      display: inline-block;
      animation: sway 3s ease-in-out infinite;
    }

    .lily:nth-child(2n) { animation-delay: -0.5s; }
    .lily:nth-child(3n) { animation-delay: -1s; }
    .lily:nth-child(4n) { animation-delay: -1.5s; }

    @keyframes sway {
      0%, 100% { transform: rotate(-10deg) scale(1); }
      50% { transform: rotate(10deg) scale(1.15); }
    }

    /* Reveal animation */
    .reveal { opacity: 0; transform: translateY(30px); }
    .reveal.show {
      animation: revealUp 0.8s ease forwards;
    }

    @keyframes revealUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .reveal:nth-child(2) { animation-delay: 0.3s; }
    .reveal:nth-child(3) { animation-delay: 0.6s; }
    .reveal:nth-child(4) { animation-delay: 0.9s; }
    .reveal:nth-child(5) { animation-delay: 1.2s; }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 50;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotateZ(0) rotateX(0); opacity: 1; }
      100% { transform: translateY(110vh) rotateZ(720deg) rotateX(360deg); opacity: 0; }
    }

    /* Cursor trail */
    .trail {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      font-size: 16px;
      animation: trailFade 1s ease forwards;
    }

    @keyframes trailFade {
      0% { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(0) translateY(-30px); }
    }

    /* Unlock animation */
    @keyframes unlockBurst {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.8; }
      100% { transform: scale(3); opacity: 0; }
    }

    .unlock-burst {
      position: fixed;
      top: 50%; left: 50%;
      width: 100px; height: 100px;
      margin: -50px;
      border-radius: 50%;
      background: radial-gradient(circle, #f48fb1, #ff80ab, transparent);
      animation: unlockBurst 1s ease forwards;
      z-index: 200;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Password Screen -->
  <div id="password-screen">
    <div class="password-box">
      <div class="lock-icon">🔒</div>
      <h2>This is Private~</h2>
      <p class="hint">hint: she likes this drink 🥤</p>
      <div class="password-input-wrapper">
        <input type="password" id="password-input" placeholder="••••" autocomplete="off" autofocus>
      </div>
      <button class="submit-btn" onclick="checkPassword()">Unlock 💖</button>
      <p class="error-msg" id="error-msg">nuh uh, try again~ 🙈</p>
    </div>
  </div>

  <!-- Hearts Background -->
  <div class="hearts-bg" id="hearts-bg"></div>

  <!-- Sparkles -->
  <div class="sparkle-container" id="sparkle-container"></div>

  <!-- Main Content -->
  <div id="main-content">
    <div class="main-card">
      <div class="greeting reveal">wsp trivedi</div>
      <div class="lilies-container reveal">
        <span class="lily">🌸</span>
        <span class="lily">🌺</span>
        <span class="lily">💐</span>
        <span class="lily">🌷</span>
        <span class="lily">🌸</span>
        <span class="lily">🌺</span>
        <span class="lily">💐</span>
        <span class="lily">🌷</span>
      </div>
      <div class="deez-line reveal">deez are for u</div>
      <div class="ml-text reveal">ml 💗</div>
      <div class="lilies-container reveal">
        <span class="lily">🌸</span>
        <span class="lily">💮</span>
        <span class="lily">🌺</span>
        <span class="lily">🏵️</span>
        <span class="lily">🌸</span>
        <span class="lily">💮</span>
        <span class="lily">🌺</span>
      </div>
    </div>
  </div>

  <script>
    // Create stars on password screen
    function createStars() {
      const screen = document.getElementById('password-screen');
      for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = star.style.height = Math.random() * 3 + 1 + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDuration = Math.random() * 3 + 2 + 's';
        star.style.animationDelay = Math.random() * 3 + 's';
        screen.appendChild(star);
      }
    }

    // Create floating hearts
    function createHearts() {
      const container = document.getElementById('hearts-bg');
      const emojis = ['💖', '💕', '💗', '💓', '🌸', '🌺', '✨', '💝', '🦋', '🌷'];
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = Math.random() * 8 + 6 + 's';
        heart.style.animationDelay = Math.random() * 10 + 's';
        heart.style.fontSize = Math.random() * 20 + 16 + 'px';
        container.appendChild(heart);
      }
    }

    // Create sparkles
    function createSparkles() {
      const container = document.getElementById('sparkle-container');
      for (let i = 0; i < 40; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = Math.random() * 100 + '%';
        sparkle.style.top = Math.random() * 100 + '%';
        sparkle.style.animationDelay = Math.random() * 3 + 's';
        sparkle.style.animationDuration = Math.random() * 2 + 1 + 's';
        container.appendChild(sparkle);
      }
    }

    // Confetti burst
    function launchConfetti() {
      const colors = ['#f48fb1', '#ff80ab', '#ffeb3b', '#fff', '#ce93d8', '#80deea', '#a5d6a7', '#ffcc80'];
      const shapes = ['circle', 'square'];
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
          confetti.style.animationDelay = Math.random() * 0.5 + 's';
          confetti.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)] === 'circle' ? '50%' : '2px';
          confetti.style.width = Math.random() * 10 + 5 + 'px';
          confetti.style.height = Math.random() * 10 + 5 + 'px';
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 5000);
        }, i * 30);
      }
    }

    // Mouse trail
    document.addEventListener('mousemove', (e) => {
      const trail = document.createElement('div');
      trail.className = 'trail';
      const emojis = ['💖', '✨', '🌸', '💕', '⭐'];
      trail.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      trail.style.left = e.clientX + 'px';
      trail.style.top = e.clientY + 'px';
      document.body.appendChild(trail);
      setTimeout(() => trail.remove(), 1000);
    });

    // Password check
    function checkPassword() {
      const input = document.getElementById('password-input').value.toLowerCase().trim();
      if (input === 'coke') {
        // Unlock!
        const burst = document.createElement('div');
        burst.className = 'unlock-burst';
        document.body.appendChild(burst);

        document.querySelector('.lock-icon').textContent = '🔓';
        document.querySelector('.password-box').style.animation = 'none';
        document.querySelector('.password-box').style.transform = 'scale(0.95)';
        document.querySelector('.password-box').style.opacity = '0.8';

        setTimeout(() => {
          document.getElementById('password-screen').style.transition = 'opacity 1s ease, transform 1s ease';
          document.getElementById('password-screen').style.opacity = '0';
          document.getElementById('password-screen').style.transform = 'scale(1.1)';

          setTimeout(() => {
            document.getElementById('password-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            document.getElementById('main-content').style.alignItems = 'center';
            document.getElementById('main-content').style.justifyContent = 'center';
            document.getElementById('main-content').style.minHeight = '100vh';
            document.getElementById('main-content').style.width = '100%';
            document.getElementById('main-content').style.position = 'relative';
            document.getElementById('main-content').style.zIndex = '10';

            // Trigger reveal animations
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach((el, i) => {
              setTimeout(() => el.classList.add('show'), i * 400);
            });

            createHearts();
            createSparkles();

            setTimeout(launchConfetti, 800);
            setTimeout(launchConfetti, 3000);
          }, 1000);
        }, 500);
      } else {
        const err = document.getElementById('error-msg');
        err.classList.remove('show');
        void err.offsetWidth;
        err.classList.add('show');
        document.getElementById('password-input').value = '';
        document.querySelector('.password-box').style.animation = 'shake 0.5s ease';
        setTimeout(() => {
          document.querySelector('.password-box').style.animation = 'fadeInUp 1s ease';
        }, 500);
      }
    }

    // Enter key support
    document.getElementById('password-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    // Init
    createStars();
  </script>
</body>
</html>
